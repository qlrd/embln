; sample-embln.conf — embln Lightning daemon configuration template.
;
; Loosely modelled on lnd's sample-lnd.conf:
;   https://github.com/lightningnetwork/lnd/blob/master/sample-lnd.conf
;
; Sections:
;   [Application Options]  node identity advertised over the wire
;   [Daemon]               emblnd process lifecycle & on-disk paths
;   [Bitcoin]              chain selection
;   [bitcoind]             how emblnd reaches its bitcoind backend
;   [open_channel]         BOLT 2 open_channel mandatory-field defaults
;   [accept_channel]       BOLT 2 accept_channel mandatory-field defaults
;
; Every key below is commented out. Uncomment and adjust to override the
; built-in defaults (see src/config.py: DEFAULT_OPEN_CHANNEL /
; DEFAULT_ACCEPT_CHANNEL — they match EmblnNode.*_defaults).
;
; Resolution order for embln.conf:
;   1. explicit --config / datadir argument
;   2. $EMBLN_BACKEND/embln.conf
;   3. ./embln.conf

[Application Options]

; Human-readable label advertised in node_announcement (BOLT 7).
;alias=embln-node

; 24-bit RGB hex (no leading 0x) advertised in node_announcement.
;color=000000

[Daemon]

; Where emblnd stores .cookie + future per-instance state. Default
; (when this key is unset) is ~/.embln/<alias>. Tests pass datadir=
; explicitly to EmblndDaemon and bypass this.
;datadir=~/.embln/embln-node

; LN P2P TCP listen port. emblnd allocates a free port if unset.
;p2p_port=9735

; emblnd JSON-RPC listen port. embln-cli connects here.
;rpc_port=10009

; Path to the SQLite database file (wallets / addresses / channels).
;db=~/.embln/embln.db

; Optional file sink for the MPSC log queue (DEBUG-level, postmortem).
; Stream sink (stderr) follows --log-level / EMBLN_LOGLEVEL regardless.
;logfile=embln.log

[Bitcoin]

; Only regtest is supported in this sandbox.
;bitcoin.network=regtest

[bitcoind]

; Backend bitcoind RPC connection. Used by BitcoindDaemon and BitcoinRpc.
;bitcoind.rpchost=127.0.0.1
;bitcoind.rpcport=18443
;bitcoind.rpcuser=bitcoin
;bitcoind.rpcpassword=secret

[open_channel]

; BOLT 2 mandatory open_channel field defaults. These show what's *built in*;
; if your application has stricter risk preferences (lower max_accepted_htlcs,
; higher dust_limit, etc.) override here. See:
;   https://github.com/lightning/bolts/blob/master/02-peer-protocol.md#the-open_channel-message

;funding_satoshis=100000000
;push_msat=0
;dust_limit_satoshis=546
;htlc_minimum_msat=1000
;feerate_per_kw=250
;to_self_delay=144
;max_accepted_htlcs=483
;channel_flags=0

[accept_channel]

; BOLT 2 mandatory accept_channel field defaults.
;minimum_depth=3
